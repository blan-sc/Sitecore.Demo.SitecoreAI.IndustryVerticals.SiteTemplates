    - ID: "4fc0c7b3-bcfb-4a9d-834d-59f6836e5fd6"
      Hint: PromoDescription
      Value: |
        <div class="ck-content"><p>Approximately half of all individuals taking Gilead HIV medicines in the United States receive them through federal and state programs at substantially discounted prices. We have a long history of working with state AIDS Drug Assistance Programs (ADAP) to provide lower pricing for our HIV medicines.</p><p>The Gilead Advancing Access® program offers HIV treatment and pre-exposure prophylaxis (PrEP) patient support, including potential options for people without insurance and co-pay assistance for eligible people with commercial insurance.</p></div>
