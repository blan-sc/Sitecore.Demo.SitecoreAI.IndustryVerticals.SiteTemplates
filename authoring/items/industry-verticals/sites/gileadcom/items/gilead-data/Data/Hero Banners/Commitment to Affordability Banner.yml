    - ID: "1dec177a-1a9b-41cf-a60c-d89f28fa41e8"
      Hint: Description
      Value: |
        <div class="ck-content"><p>Innovation means nothing if it doesn’t reach the people who need it most. At Gilead, access isn’t an afterthought: it’s embedded in how medicines are developed, evaluated for their value, and delivered. As pioneers of voluntary licensing since 2006, Gilead continues to push boundaries in ensuring breakthrough therapies reach those who would benefit.</p><p>We operate in both resource-limited countries and the United States, adapting our approach to meet the unique needs of each population. Through voluntary licensing with generic manufacturers, we provide affordable medicines globally, while U.S. patient support programs remove financial barriers for Americans. Together, these efforts ensure comprehensive global access to our therapies.</p></div>
