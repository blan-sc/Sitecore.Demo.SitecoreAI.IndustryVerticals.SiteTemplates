      Value: |
        <div class="ck-content"><p>We offer support navigating access and coverage for individuals who are unsure if their insurance plan provides coverage or affordable co-pays to our medicines. Our case managers help individuals understand what their insurance will cover and provide research on potential alternative coverage and co-pay support.</p><p>We also provide access to Gilead medications at no cost for eligible, uninsured individuals.</p></div>
