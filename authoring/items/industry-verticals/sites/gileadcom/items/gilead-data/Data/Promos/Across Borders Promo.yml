        <div class="ck-content"><p>We forge connections between patients and their communities — across borders, between public health providers and private industry — to create solutions that address critical health inequities in low- and middle-income countries. We build innovative, sustainable programs that enable long-term access for millions of people and empower our partners doing work on the ground so that life-changing treatments for HIV, viral hepatitis and invasive fungal infections get to those who need them most.</p></div>
