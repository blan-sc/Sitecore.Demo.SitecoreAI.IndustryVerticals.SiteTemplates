    - ID: "729034fc-24f3-40b7-8fa4-fb49d7de20dd"
      Hint: Text
      Value: |
        <div class="ck-content"><figure class="image image-style-align-right"><img style="aspect-ratio:588/340;" src="-/media/C664DC439368435CB9D0A24E37D98002.ashx" alt="medication-acess-morris-singletary-promo" width="588" height="340" /></figure><p style="text-align:right;">We forge connections between patients and their communities — across borders, between public health providers and private industry — to create solutions that address critical health inequities in low- and middle-income countries. We build innovative, sustainable programs that enable long-term access for millions of people and empower our partners doing work on the ground so that life-changing treatments for HIV, viral hepatitis and invasive fungal infections get to those who need them most.</p><p>&nbsp;</p></div>
