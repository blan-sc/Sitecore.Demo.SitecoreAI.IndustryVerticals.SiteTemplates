        <div class="ck-content"><h5>1. What medication access resources are available?</h5><p>Patients and caregivers can use this page to find information about support resources, affordability information, and next steps for learning more.</p><h5>2. Who can use patient support resources?</h5><p>Support resources may be designed for patients, caregivers, or care teams, depending on the program and region.</p><h5>3. Where can patients find affordability information?</h5><p>Patients can start with the medication access resources on this page and review related support information linked from this section.</p><h5>4. What is managed access?</h5><p>Managed access may provide eligible patients with serious or life-threatening conditions access to certain medicines outside of clinical trials when no comparable therapy is available and defined criteria are met.</p><h5>5. How does Gilead expand access globally?</h5><p>Gilead works with public health organizations, generic manufacturers, governments, advocacy groups, NGOs, and other partners to support access to medicines in low- and middle-income countries.</p></div>
